<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Product - SmartExpApp</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#1c1b1b",
                        "on-secondary-container": "#636262",
                        "error-container": "#ffdad6",
                        "tertiary": "#5d5f5f",
                        "surface-tint": "#904d00",
                        "secondary": "#5f5e5e",
                        "on-surface": "#1a1c1c",
                        "surface-container-high": "#e8e8e8",
                        "surface-variant": "#e2e2e2",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed-variant": "#6e3900",
                        "on-secondary-fixed-variant": "#474746",
                        "on-tertiary-container": "#3d3f3f",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-primary-container": "#623200",
                        "secondary-container": "#e2dfde",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f0f1f1",
                        "surface": "#f9f9f9",
                        "primary-container": "#ff8c00",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#ffdcc3",
                        "outline-variant": "#ddc1ae",
                        "on-surface-variant": "#564334",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#eeeeee",
                        "outline": "#897362",
                        "on-primary-fixed": "#2f1500",
                        "inverse-primary": "#ffb77d",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-background": "#1a1c1c",
                        "primary-fixed-dim": "#ffb77d",
                        "on-tertiary-fixed-variant": "#454747",
                        "surface-container-highest": "#e2e2e2",
                        "inverse-surface": "#2f3131",
                        "tertiary-container": "#a9aaaa",
                        "secondary-fixed-dim": "#c8c6c5",
                        "background": "#f9f9f9",
                        "surface-container-low": "#f3f3f4",
                        "surface-dim": "#dadada",
                        "on-error": "#ffffff",
                        "primary": "#904d00",
                        "tertiary-fixed": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "container-padding": "20px",
                        "xs": "4px",
                        "md": "16px",
                        "base": "8px",
                        "lg": "24px",
                        "gutter": "16px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "cta": ["Inter"],
                        "label-caps": ["Inter"],
                        "h3": ["Inter"],
                        "h2": ["Inter"],
                        "h1": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "cta": ["16px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h3": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background flex justify-between items-center w-full px-container-padding py-md shadow-sm docked full-width top-0 transition-all duration-200 active:scale-95 z-40 relative">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-h2 text-h2 font-bold text-on-surface dark:text-on-background text-center flex-1">
            SmartExp
        </div>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high p-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto px-container-padding py-xl pb-[100px] md:pb-xl flex flex-col gap-xl">
<div class="flex flex-col gap-xs">
<h1 class="font-h1 text-h1 text-on-background">Add Product</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter details to track expiration.</p>
</div>
<!-- Form Container (Card Style) -->
<form class="bg-surface border border-surface-variant rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-lg flex flex-col gap-lg">
<!-- Product Name Input -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface" for="product-name">Product Name</label>
<div class="relative">
<input class="w-full bg-surface-bright border-none focus:border-on-surface focus:ring-1 focus:ring-on-surface rounded-lg py-md px-md font-body-lg text-body-lg text-on-background placeholder:text-on-surface-variant/50 transition-shadow" id="product-name" placeholder="e.g., Organic Milk" type="text"/>
</div>
</div>
<!-- Storage State Selector -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface">Storage Method</label>
<div class="grid grid-cols-3 gap-sm bg-surface-container-low p-xs rounded-lg">
<!-- Option 1: Active -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="storage" type="radio" value="room"/>
<div class="flex flex-col items-center justify-center py-sm px-xs rounded-md peer-checked:bg-surface peer-checked:shadow-sm peer-checked:text-primary-container text-on-surface-variant transition-all">
<span class="material-symbols-outlined mb-1" data-icon="kitchen" style="font-variation-settings: 'FILL' 0;">shelves</span>
<span class="font-label-caps text-label-caps text-center">Room Temp</span>
</div>
</label>
<!-- Option 2: Inactive -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="storage" type="radio" value="fridge"/>
<div class="flex flex-col items-center justify-center py-sm px-xs rounded-md peer-checked:bg-surface peer-checked:shadow-sm peer-checked:text-primary-container text-on-surface-variant transition-all">
<span class="material-symbols-outlined mb-1" data-icon="ac_unit" style="font-variation-settings: 'FILL' 0;">kitchen</span>
<span class="font-label-caps text-label-caps text-center">Refrigerator</span>
</div>
</label>
<!-- Option 3: Inactive -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="storage" type="radio" value="freeze"/>
<div class="flex flex-col items-center justify-center py-sm px-xs rounded-md peer-checked:bg-surface peer-checked:shadow-sm peer-checked:text-primary-container text-on-surface-variant transition-all">
<span class="material-symbols-outlined mb-1" data-icon="severe_cold" style="font-variation-settings: 'FILL' 0;">ac_unit</span>
<span class="font-label-caps text-label-caps text-center">Freeze</span>
</div>
</label>
</div>
</div>
<!-- Expiry Date Picker -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface" for="expiry-date">Expiry Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none" data-icon="calendar_today">calendar_today</span>
<input class="w-full bg-surface-bright border-none focus:border-on-surface focus:ring-1 focus:ring-on-surface rounded-lg py-md pl-[48px] pr-md font-body-lg text-body-lg text-on-background transition-shadow appearance-none" id="expiry-date" type="date"/>
</div>
</div>
</form>
<!-- Primary Action -->
<div class="mt-auto md:mt-xl flex flex-col">
<button class="w-full bg-primary-container text-on-primary font-cta text-cta py-md px-lg rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.1)] hover:shadow-[0_2px_10px_rgba(0,0,0,0.1)] hover:translate-y-[1px] transition-all flex justify-center items-center gap-sm" type="button">
<span class="material-symbols-outlined" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
                Add Product
            </button>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface dark:bg-background border-t border-surface-variant dark:border-outline-variant shadow-lg docked full-width bottom-0 rounded-t-xl fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter py-base h-[72px]">
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:text-primary dark:hover:text-primary-fixed transition-transform duration-150 active:scale-90 w-16">
<span class="material-symbols-outlined mb-1" data-icon="inventory_2">inventory_2</span>
<span class="font-label-caps text-label-caps">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:text-primary dark:hover:text-primary-fixed transition-transform duration-150 active:scale-90 w-16">
<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>
<span class="font-label-caps text-label-caps">Stats</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-container font-semibold transition-transform duration-150 active:scale-90 w-16 scale-110">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-caps text-label-caps">Add</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:text-primary dark:hover:text-primary-fixed transition-transform duration-150 active:scale-90 w-16">
<span class="material-symbols-outlined mb-1" data-icon="restaurant">restaurant</span>
<span class="font-label-caps text-label-caps">Recipes</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container dark:text-on-secondary-fixed-variant hover:text-primary dark:hover:text-primary-fixed transition-transform duration-150 active:scale-90 w-16">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps">Settings</span>
</button>
</nav>
</body></html>
