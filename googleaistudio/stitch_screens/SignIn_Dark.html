<script>
        // Micro-interaction for input hover/focus effects or background parallax
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Soften card on mouse leave
        document.querySelector('.glass-card').addEventListener('mouseleave', (e) => {
            const card = document.querySelector('.glass-card');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'transform 0.5s ease';
        });

        document.querySelector('.glass-card').addEventListener('mouseenter', (e) => {
            const card = document.querySelector('.glass-card');
            card.style.transition = 'none';
        });
    </script>
