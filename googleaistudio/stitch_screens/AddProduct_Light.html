<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

      tailwind.config = {
        darkMode: "class",
        theme: {

                    "outline": "#897362",
                    "on-surface": "#1a1c1c",

                    "on-secondary-fixed": "#1c1b1b",
                    "surface-tint": "#904d00",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#ffb77d",
                    "tertiary-fixed": "#e2e2e2",
                    "surface": "#f9f9f9",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f0f1f1",
                    "surface-dim": "#dadada",
                    "primary": "#904d00",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#3d3f3f",
                    "on-primary-container": "#623200",
                    "secondary": "#5f5e5e",
                    "background": "#f9f9f9",
                    "surface-container": "#eeeeee",
                    "on-surface-variant": "#564334",
                    "surface-container-high": "#e8e8e8",
                    "inverse-primary": "#ffb77d",
                    "secondary-fixed-dim": "#c8c6c5",
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary": "#ffffff",
                    "on-secondary-container": "#636262",
                    "primary-container": "#ff8c00",
                    "on-background": "#1a1c1c",
                    "on-primary-fixed": "#2f1500",
                    "surface-bright": "#f9f9f9",
                    "surface-container-low": "#f3f3f4",
                    "primary-fixed": "#ffdcc3",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#6e3900",
                    "inverse-surface": "#2f3131",
                    "secondary-container": "#e2dfde",
                    "outline-variant": "#ddc1ae",
                    "on-tertiary-fixed-variant": "#454747",
                    "error": "#ba1a1a",
                    "tertiary-container": "#a9aaaa",
                    "on-tertiary-fixed": "#1a1c1c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "2xl": "1.5rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "20px",
                    "xl": "32px",
                    "lg": "24px",
                    "md": "16px",
                    "sm": "12px",
                    "gutter": "16px",
                    "xs": "4px",
                    "base": "8px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "h2": ["Inter"],
                    "body-md": ["Inter"],
                    "label-caps": ["Inter"],
                    "h3": ["Inter"],
                    "body-lg": ["Inter"],
                    "cta": ["Inter"],

            },
            "fontSize": {

                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                    "cta": ["16px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "h1": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f7f8fc;
            min-height: 100dvh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .blob {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.1;
        }
        .blob-primary { background: #ff8c00; top: 10%; right: -50px; }
        .blob-tertiary { background: #00b5fc; bottom: 15%; left: -50px; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: grayscale(1) brightness(0.5);
            cursor: pointer;
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<div class="blob blob-primary"></div>
<div class="blob blob-tertiary"></div>
<!-- Top Navigation Bar -->
<header class="glass-panel sticky top-0 border-b border-white/20 flex justify-between items-center px-margin-mobile h-16 w-full z-40">
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-black/5 transition-colors duration-200 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">SmartExpApp</h1>
</div>
<div class="flex items-center gap-2">
<button class="text-on-surface-variant w-10 h-10 rounded-full bg-black/5 flex items-center justify-center hover:bg-black/10 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-lg mx-auto px-margin-mobile pt-lg pb-28 relative z-10">
<section class="space-y-xl">
<div class="header-section">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Add New Product</h2>
<p class="text-secondary font-body-md mt-xs">Register a new item to track its freshness.</p>
</div>
<!-- Form Container -->
<form class="space-y-lg" id="add-product-form">
<!-- Product Name Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-secondary/80 ml-1 uppercase tracking-widest" for="product_name">Product Name</label>
<div class="relative">
<input class="w-full h-14 glass-input rounded-xl px-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all placeholder:text-secondary/50" id="product_name" placeholder="e.g. Greek Yogurt" type="text">
</div>
</div>
<!-- Storage Method Selection -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-secondary/80 ml-1 uppercase tracking-widest">Storage Method</label>
<div class="grid grid-cols-3 gap-md">
<button class="storage-btn flex flex-col items-center justify-center p-4 rounded-xl border border-black/5 bg-black/5 hover:bg-black/10 transition-all text-secondary group" id="storage-room" onclick="selectStorage('room')" type="button">
<span class="material-symbols-outlined mb-2 group-[.active]:text-primary" data-icon="thermostat">thermostat</span>
<span class="font-label-sm text-label-sm">Room Temp</span>
</button>
<button class="storage-btn flex flex-col items-center justify-center p-4 rounded-xl border hover:bg-black/10 transition-all group active border-primary/50 bg-primary/10 text-primary" id="storage-fridge" onclick="selectStorage('fridge')" style="transform: scale(0.95);" type="button">
<span class="material-symbols-outlined mb-2 group-[.active]:text-primary" data-icon="refrigerator">kitchen</span>
<span class="font-label-sm text-label-sm">Refrigerator</span>
</button>
<button class="storage-btn flex flex-col items-center justify-center p-4 rounded-xl border border-black/5 bg-black/5 hover:bg-black/10 transition-all text-secondary group" id="storage-freeze" onclick="selectStorage('freeze')" type="button">
<span class="material-symbols-outlined mb-2 group-[.active]:text-primary" data-icon="ac_unit">ac_unit</span>
<span class="font-label-sm text-label-sm">Freeze</span>
</button>
</div>
</div>
<!-- Expiry Date Picker -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-secondary/80 ml-1 uppercase tracking-widest" for="expiry_date">Expiry Date</label>
<div class="relative">
<input class="w-full h-14 glass-input rounded-xl px-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all" id="expiry_date" type="date">
</div>
</div>
<!-- Action Button -->
<div class="pt-lg">
<button class="w-full h-16 bg-[#ff8c00] text-white font-bold rounded-full shadow-[0_8px_24px_rgba(255,140,0,0.3)] hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg" type="submit">
<span class="material-symbols-outlined font-bold" data-icon="add">add</span>
                    Add Product
                </button>
</div>
</form>
<!-- Quick Tips Card -->
<div class="p-lg rounded-xl glass-panel flex items-start gap-md">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="lightbulb">lightbulb</span>
</div>
<div>
<h4 class="text-on-surface font-semibold text-body-md">Did you know?</h4>
<p class="text-secondary text-label-md mt-xs leading-relaxed">
                    Storing leafy greens in the refrigerator crisper drawer with a paper towel can extend their freshness by up to 5 days.
                </p>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe glass-panel border-t border-white/40"><a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Inventory</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Stats</span>
</a>
<div class="relative w-16 h-10 flex items-center justify-center">
<a class="absolute bottom-6 flex items-center justify-center text-white bg-[#ff8c00] rounded-full h-16 w-16 shadow-[0_8px_24px_rgba(255,140,0,0.4)] hover:brightness-110 transition-all duration-300 active:scale-90 border-4 border-[#f7f8fc] z-50" href="#">
<span class="material-symbols-outlined text-3xl font-bold" data-icon="add">add</span>
</a>
</div>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1" href="#">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Agent</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Settings</span>
</a></nav>
<script>
    function selectStorage(type) {
        // Reset all buttons
        document.querySelectorAll('.storage-btn').forEach(btn => {
            btn.classList.remove('active', 'border-primary/50', 'bg-primary/10', 'text-primary');
            btn.classList.add('border-black/5', 'bg-black/5', 'text-secondary');
            btn.style.transform = 'scale(1)';
        });

        // Set active button
        const activeBtn = document.getElementById('storage-' + type);
        activeBtn.classList.add('active', 'border-primary/50', 'bg-primary/10', 'text-primary');
        activeBtn.classList.remove('border-black/5', 'bg-black/5', 'text-secondary');
        
        // Interaction feedback
        activeBtn.style.transform = 'scale(0.95)';
    }

    // Initialize
    window.onload = () => {
        selectStorage('fridge');
        
        // Set today's date + 7 days
        const today = new Date();
        today.setDate(today.getDate() + 7);
        const dateString = today.toISOString().split('T')[0];
        document.getElementById('expiry_date').value = dateString;
    };

    // Form submission
    document.getElementById('add-product-form').onsubmit = (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Adding...';
        btn.classList.add('opacity-80');
        setTimeout(() => {
            btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Product Added!';
            btn.style.backgroundColor = '#10b981'; 
            btn.style.boxShadow = '0 8px 24px rgba(16, 185, 129, 0.3)';
            setTimeout(() => {
                location.reload();
            }, 1500);
        }, 1000);
    };
</script>


</body></html>
