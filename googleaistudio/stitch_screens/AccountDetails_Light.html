<body class="bg-background font-body-md text-on-surface overflow-x-hidden min-h-screen">
<!-- Soft Decorative Glows -->
<div class="fixed top-[-10%] right-[-5%] w-[500px] h-[500px] glow-orange rounded-full z-0"></div>
<div class="fixed bottom-[-10%] left-[-5%] w-[600px] h-[600px] glow-blue rounded-full z-0"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm">
<div class="flex justify-between items-center px-container-padding h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-container rounded-full transition-colors active:scale-95" data-icon="arrow_back">arrow_back</button>
<h1 class="font-h2 text-h2 font-bold text-primary">Account Details</h1>
</div>
<div class="material-symbols-outlined text-primary" data-icon="bubble_chart">bubble_chart</div>
</div>
</header>
<main class="relative z-10 pt-24 pb-32 px-container-padding max-w-3xl mx-auto">
<!-- Glass Card Content -->
<div class="glass rounded-[2rem] p-8 shadow-xl">
<!-- Profile Section -->
<div class="flex flex-col items-center mb-xl">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg">
<img alt="Alex Johnson" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a young man named Alex Johnson with a friendly expression. He has short brown hair and is wearing a clean, minimalist white shirt. The lighting is soft and natural, emphasizing a bright, organized light-mode aesthetic. The background is a clean, neutral grey that complements the minimalist and efficient brand identity of SmartExpApp." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHKp3NOogJx-MEkoewAyEExj89ibwojwmKeeP4MHSxJyqP6QJ1Xlb3haq1kXcBE0LTr9uH0PP56Qe7Nyi8BS_AMs1fAIEFGHhJCaNTm8Ycc4jewpSls4ALFoMwx-5iL7yeLnpppXX7FSewaqyzksKV8NIgLekzU6qgshKolC3z-g2UMjIpN2KR5zDKJtgf9-cKiIEEoa1UA4ZmYThd4fpblzFiCEHLA8KdzmxJ88bBEmtdHs_nAsNgiSellrfXjTiDBGrijLkfuN12">
</div>
<button class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container p-2 rounded-full shadow-md active:scale-90 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined !text-[20px]" data-icon="edit">edit</span>
</button>
</div>
<h2 class="font-h1 text-h1 mt-md text-on-surface">Alex Johnson</h2>
<p class="font-body-md text-on-surface-variant">Member since October 2023</p>
</div>
<!-- Form Fields -->
<section class="space-y-lg mb-xl">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-sm">Full Name</label>
<div class="glass-input h-14 rounded-xl flex items-center px-md">
<span class="material-symbols-outlined text-primary mr-sm" data-icon="person">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-on-surface" placeholder="Your Name" type="text" value="Alex Johnson">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-sm">Email Address</label>
<div class="glass-input h-14 rounded-xl flex items-center px-md">
<span class="material-symbols-outlined text-primary mr-sm" data-icon="mail">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-on-surface" placeholder="your@email.com" type="email" value="alex.j@example.com">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-sm">Phone Number</label>
<div class="glass-input h-14 rounded-xl flex items-center px-md">
<span class="material-symbols-outlined text-primary mr-sm" data-icon="call">call</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-on-surface" placeholder="+1 000 000 000" type="tel" value="+1 234 567 890">
</div>
</div>
</section>
<!-- Security Section -->
<section class="mb-xl">
<h3 class="font-h3 text-h3 mb-md text-on-surface flex items-center">
<span class="material-symbols-outlined mr-sm text-primary" data-icon="security" data-weight="fill" style="font-variation-settings: 'FILL' 1;">security</span>
                    Security
                </h3>
<div class="space-y-sm">
<button class="w-full glass-input p-md rounded-xl flex items-center justify-between hover:bg-surface-container transition-colors">
<div class="flex items-center">
<span class="material-symbols-outlined mr-md text-on-surface-variant" data-icon="lock_reset">lock_reset</span>
<span class="font-body-md font-semibold">Change Password</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full glass-input p-md rounded-xl flex items-center justify-between hover:bg-surface-container transition-colors">
<div class="flex items-center">
<span class="material-symbols-outlined mr-md text-on-surface-variant" data-icon="verified_user">verified_user</span>
<div class="text-left">
<span class="block font-body-md font-semibold">Two-Factor Authentication</span>
<span class="text-label-caps text-primary">ENABLED</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Data Section -->
<section>
<h3 class="font-h3 text-h3 mb-md text-on-surface flex items-center">
<span class="material-symbols-outlined mr-sm text-primary" data-icon="database" data-weight="fill" style="font-variation-settings: 'FILL' 1;">database</span>
                    Data &amp; Privacy
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<button class="glass-input p-md rounded-xl flex items-center hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined mr-md text-on-surface-variant" data-icon="download">download</span>
<span class="font-body-md font-semibold">Export Data</span>
</button>
<button class="glass-input p-md rounded-xl flex items-center hover:bg-error/10 hover:text-error transition-colors border-none group">
<span class="material-symbols-outlined mr-md text-error" data-icon="delete_forever">delete_forever</span>
<span class="font-body-md font-semibold text-error">Delete Account</span>
</button>
</div>
</section>
<!-- Update Button -->
<div class="mt-xl">
<button class="w-full bg-primary-container text-on-primary font-cta text-cta h-14 rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all">
                    Save Changes
                </button>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface/80 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl"><a class="flex flex-col items-center justify-center text-on-secondary-container p-2 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span><span class="text-label-caps font-label-caps mt-1">Inventory</span></a><a class="flex flex-col items-center justify-center text-on-secondary-container p-2 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined" data-icon="insights">insights</span><span class="text-label-caps font-label-caps mt-1">Stats</span></a><a class="flex flex-col items-center justify-center -mt-8" href="#"><div class="bg-primary-container text-on-primary p-4 rounded-full shadow-lg active:scale-90 transition-transform flex items-center justify-center glow-orange"><span class="material-symbols-outlined !text-[32px]" data-icon="add">add</span></div></a><a class="flex flex-col items-center justify-center text-on-secondary-container p-2 hover:text-primary transition-colors" href="#"><span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span><span class="text-label-caps font-label-caps mt-1">Agent</span></a><a class="flex flex-col items-center justify-center text-primary p-2 transition-colors" href="#"><span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span><span class="text-label-caps font-label-caps mt-1">Settings</span></a></nav>
<script>
        // Simple micro-interaction for glass inputs
        const inputs = document.querySelectorAll('.glass-input input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary/20', 'border-primary/30');
                input.parentElement.style.background = 'rgba(255, 255, 255, 0.6)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary/20', 'border-primary/30');
                input.parentElement.style.background = 'rgba(255, 255, 255, 0.4)';
            });
        });
    </script>


</body></html>
