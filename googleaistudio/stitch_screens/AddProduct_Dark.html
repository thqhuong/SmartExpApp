<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-dim": "#131316",
                    "secondary": "#c6c6c7",
                    "surface-bright": "#39393c",
                    "surface-container-lowest": "#0e0e11",
                    "on-secondary-fixed": "#1a1c1d",
                    "primary-container": "#ff8c00",
                    "on-primary-fixed-variant": "#6e3900",
                    "tertiary-fixed": "#c7e7ff",
                    "tertiary": "#85cfff",
                    "secondary-container": "#454748",
                    "on-background": "#e4e1e6",
                    "on-tertiary-fixed-variant": "#004c6c",
                    "inverse-primary": "#904d00",
                    "inverse-surface": "#e4e1e6",
                    "tertiary-container": "#00b5fc",
                    "primary": "#ffb77d",
                    "on-tertiary-fixed": "#001e2e",
                    "secondary-fixed-dim": "#c6c6c7",
                    "surface-container-highest": "#353438",
                    "on-primary": "#4d2600",
                    "surface-tint": "#ffb77d",
                    "surface": "#131316",
                    "on-secondary": "#2f3132",
                    "surface-container-low": "#1b1b1e",
                    "on-error-container": "#ffdad6",
                    "on-surface": "#e4e1e6",
                    "on-surface-variant": "#ddc1ae",
                    "primary-fixed": "#ffdcc3",
                    "outline": "#a48c7a",
                    "on-tertiary": "#00344c",
                    "surface-container": "#1f1f22",
                    "on-primary-fixed": "#2f1500",
                    "on-error": "#690005",
                    "surface-variant": "#353438",
                    "on-primary-container": "#623200",
                    "error-container": "#93000a",
                    "on-secondary-container": "#b4b5b6",
                    "outline-variant": "#564334",
                    "inverse-on-surface": "#303033",
                    "secondary-fixed": "#e2e2e3",
                    "on-tertiary-container": "#004360",
                    "surface-container-high": "#2a2a2d",
                    "tertiary-fixed-dim": "#85cfff",
                    "background": "#0e0e11",
                    "on-secondary-fixed-variant": "#454748",
                    "primary-fixed-dim": "#ffb77d",
                    "error": "#ffb4ab"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "base": "8px",
                    "sm": "8px",
                    "margin-desktop": "40px",
                    "lg": "24px",
                    "gutter": "16px",
                    "xl": "32px",
                    "md": "16px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #0e0e11; color: #e4e1e6; -webkit-font-smoothing: antialiased; min-height: max(884px, 100dvh); }
        .glass-card { 
            background: rgba(31, 31, 34, 0.45); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(5) hue-rotate(15deg);
        }
        .blob {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.15;
        }
        .blob-primary { background: #ff8c00; top: 10%; right: -50px; }
        .blob-tertiary { background: #00b5fc; bottom: 15%; left: -50px; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<div class="blob blob-primary"></div>
<div class="blob blob-tertiary"></div>
<!-- Top Navigation Bar -->
<header class="bg-surface/60 backdrop-blur-md docked full-width top-0 border-b border-white/10 flex justify-between items-center px-margin-mobile h-16 w-full z-40 fixed">
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-white/5 transition-colors duration-200 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">SmartExpApp</h1>
</div>
<div class="flex items-center gap-2">
<button class="text-on-surface-variant w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-lg mx-auto px-margin-mobile pt-24 pb-28">
<section class="space-y-xl">
<div class="header-section">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Add New Product</h2>
<p class="text-secondary/70 font-body-md mt-xs">Register a new item to track its freshness.</p>
</div>
<!-- Form Container -->
<form class="space-y-lg" id="add-product-form">
<!-- Product Name Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-secondary/80 ml-1 uppercase tracking-widest" for="product_name">Product Name</label>
<div class="relative">
<input class="w-full h-14 glass-input rounded-xl px-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all placeholder:text-surface-bright/50 bg-surface-container-lowest" id="product_name" placeholder="e.g. Greek Yogurt" type="text">
</div>
</div>
<!-- Storage Method Selection -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-secondary/80 ml-1 uppercase tracking-widest">Storage Method</label>
<div class="grid grid-cols-3 gap-md">
<button class="storage-btn flex flex-col items-center justify-center p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all text-secondary group" id="storage-room" onclick="selectStorage('room')" type="button">
<span class="material-symbols-outlined mb-2 group-[.active]:text-primary" data-icon="thermostat">thermostat</span>
<span class="font-label-sm text-label-sm">Room Temp</span>
</button>
<button class="storage-btn flex flex-col items-center justify-center p-4 rounded-xl border hover:bg-white/10 transition-all group active border-primary/50 bg-primary/10 text-primary" id="storage-fridge" onclick="selectStorage('fridge')" style="transform: scale(1);" type="button">
<span class="material-symbols-outlined mb-2 group-[.active]:text-primary" data-icon="refrigerator">kitchen</span>
<span class="font-label-sm text-label-sm">Refrigerator</span>
</button>
<button class="storage-btn flex flex-col items-center justify-center p-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all text-secondary group" id="storage-freeze" onclick="selectStorage('freeze')" type="button">
<span class="material-symbols-outlined mb-2 group-[.active]:text-primary" data-icon="ac_unit">ac_unit</span>
<span class="font-label-sm text-label-sm">Freeze</span>
</button>
</div>
</div>
<!-- Expiry Date Picker -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-secondary/80 ml-1 uppercase tracking-widest" for="expiry_date">Expiry Date</label>
<div class="relative">
<input class="w-full h-14 glass-input rounded-xl px-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all bg-surface-container-lowest" id="expiry_date" type="date">
</div>
</div>
<!-- Action Button -->
<div class="pt-lg">
<button class="w-full h-16 bg-[#ff8c00] text-surface-container-lowest font-bold rounded-full shadow-[0_8px_32px_rgba(255,140,0,0.3)] hover:brightness-110 hover:shadow-[0_12px_40px_rgba(255,140,0,0.5)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg" type="submit">
<span class="material-symbols-outlined font-bold" data-icon="add">add</span>
                        Add Product
                    </button>
</div>
</form>
<!-- Quick Tips Card (Glassmorphism) -->
<div class="mt-xl p-lg rounded-xl glass-card flex items-start gap-md">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="lightbulb">lightbulb</span>
</div>
<div>
<h4 class="text-on-surface font-semibold text-body-md">Did you know?</h4>
<p class="text-secondary text-label-md mt-xs leading-relaxed">
                        Storing leafy greens in the refrigerator crisper drawer with a paper towel can extend their freshness by up to 5 days.
                    </p>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar (Glassmorphism) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-[#131316]/60 backdrop-blur-xl border-t border-white/10"><button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Inventory</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Stats</span>
</button>
<!-- Floating Action Button in Nav -->
<button class="flex items-center justify-center text-surface-container-lowest bg-[#ff8c00] rounded-full h-16 w-16 shadow-[0_8px_32px_rgba(255,140,0,0.4)] hover:shadow-[0_12px_40px_rgba(255,140,0,0.6)] hover:opacity-95 transition-all duration-300 active:scale-90 -translate-y-8 border-4 border-[#131316]">
<span class="material-symbols-outlined text-3xl font-bold" data-icon="add">add</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Agent</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:text-primary transition-colors duration-150 active:scale-95 w-16 gap-1">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-[10px] font-medium tracking-wide">Settings</span>
</button></nav>
<script>
        function selectStorage(type) {
            // Reset all buttons
            document.querySelectorAll('.storage-btn').forEach(btn => {
                btn.classList.remove('active', 'border-primary/50', 'bg-primary/10', 'text-primary');
                btn.classList.add('border-white/10', 'bg-white/5', 'text-secondary');
            });

            // Set active button
            const activeBtn = document.getElementById('storage-' + type);
            activeBtn.classList.add('active', 'border-primary/50', 'bg-primary/10', 'text-primary');
            activeBtn.classList.remove('border-white/10', 'bg-white/5', 'text-secondary');
            
            // Interaction feedback
            activeBtn.style.transform = 'scale(0.95)';
            setTimeout(() => activeBtn.style.transform = 'scale(1)', 100);
        }

        // Initialize with a default selection
        window.onload = () => {
            selectStorage('fridge');
            
            // Set today's date as default for expiry picker (plus 7 days)
            const today = new Date();
            today.setDate(today.getDate() + 7);
            const dateString = today.toISOString().split('T')[0];
            document.getElementById('expiry_date').value = dateString;
        };

        // Form submission animation
        document.getElementById('add-product-form').onsubmit = (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Adding...';
            btn.classList.add('opacity-80');
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Product Added!';
                btn.style.backgroundColor = '#10b981'; // Green
                btn.style.boxShadow = '0 8px 32px rgba(16, 185, 129, 0.3)';
                setTimeout(() => {
                    location.reload(); // Reset form
                }, 1500);
            }, 1000);
        };
    </script>
</body></html>
